name: Check research and catalogue
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python research/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node site/build.mjs
      - run: node --check site/dist/server/index.js
